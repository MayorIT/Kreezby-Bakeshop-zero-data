<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Customer Help Center</title>
    <link rel="stylesheet" href="../css/pages/customer/inbox-customer.css">

</head>
<body>
    <div class="help-center-shell">
        <h1>Customer Help Center</h1>
        <p>Need assistance? Submit your request here and our admin/staff support team will follow up shortly.</p>
        
        <div class="inbox-section">
            <div class="live-agent-request">
                <h3>💬 Chat with Us!</h3>
                <p>Describe your issue below and one of our staffs will connect with you shortly.</p>
                <form class="live-agent-form" onsubmit="submitLiveAgentRequest(event)">
                    <textarea placeholder="Describe your issue or question in detail..." required></textarea>
                    <button type="submit">Start Chat</button>
                </form>
            </div>
        </div>

        <div class="help-center-actions">
            <a href="customer.html" class="help-link">Back to Shop</a>
            <a href="../auth/log_in.html" class="help-link">↩ Log Out</a>
        </div>
    </div>
    <script>
    function submitLiveAgentRequest(event) {
        event.preventDefault();
        alert('Your live agent request has been submitted. A support agent will connect with you shortly.');
    }
    </script>
</body>
</html>
