<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - Wholesaler</title>
    <link rel="stylesheet" href="../css/pages/wholesaler/wholesaler-portal.css">
</head>
<body>
<header class="top-navbar-node">
    <div class="brand-logo-panel">Kreezby</div>
    <div class="top-nav-links-right">
        <a class="top-nav-item home-badge" href="wholesaler-directory.html">Wholesaler Portal</a>
    </div>
</header>
<div class="workspace-container" style="max-width:720px;margin:40px auto;padding:24px;">
    <h1 class="page-title">Report an Issue — Wholesaler</h1>
    <p class="page-subtitle">Submit issues related to bulk orders, deliveries, invoicing, or stock allocation.</p>
    <div class="panel-data-card">
        <div class="card-body-padded">
            <form class="report-form" onsubmit="event.preventDefault(); alert('Issue submitted. Our team will contact you shortly.');">
                <p><label>Full Name<br><input type="text" required style="width:100%;padding:8px;margin-top:4px;"></label></p>
                <p style="margin-top:12px;"><label>Email<br><input type="email" required style="width:100%;padding:8px;margin-top:4px;"></label></p>
                <p style="margin-top:12px;"><label>Issue Details<br><textarea required rows="5" style="width:100%;padding:8px;margin-top:4px;"></textarea></label></p>
                <button type="submit" class="btn-call-to-action" style="margin-top:16px;">Submit Issue</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
