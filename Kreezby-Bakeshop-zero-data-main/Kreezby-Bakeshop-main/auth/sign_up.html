<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Kreezby Family</title>
    <link rel="stylesheet" href="../css/pages/sign_up.css">

    
</head>
<body>

<div class="signup-container">
    <div class="branding-header">
        <div class="logo-text">Kreezby</div>
        <div class="tagline">The Crinkle Factory - Making your life sweeter!</div>
    </div>

    <h2>Join the Kreezby Family</h2>

    <form class="signup-form" novalidate onsubmit="return false;">
        <div class="row">
            <div class="field-group">
                <input type="text" name="firstName" placeholder="First Name" required>
            </div>
            <div class="field-group">
                <input type="text" name="lastName" placeholder="Last Name" required>
            </div>
        </div>

        <div class="field-group full-width">
            <label>Birthday</label>
            <div class="row" style="margin-bottom: 0;">
                <select name="birthMonth" required>
                    <option value="">Month</option>
                    <option value="1">Jan</option>
                    <option value="8" selected>Aug</option>
                    </select>
                <select name="birthDay" required>
                    <option value="">Day</option>
                    <option value="25" selected>25</option>
                </select>
                <select name="birthYear" required>
                    <option value="">Year</option>
                    <option value="1998" selected>1998</option>
                </select>
            </div>
        </div>

        <div class="field-group full-width">
            <label>Gender</label>
            <div class="gender-container">
                <label class="gender-option">
                    <input type="radio" name="gender" value="Female"> Female
                </label>
                <label class="gender-option">
                    <input type="radio" name="gender" value="Male" checked> Male
                </label>
                <label class="gender-option">
                    <input type="radio" name="gender" value="Others"> Others
                </label>
            </div>
        </div>

        <div class="full-width">
            <input type="text" name="contactInfo" placeholder="Email or Phone Number" required>
        </div>

        <div class="full-width">
            <input type="password" name="password" placeholder="New Password" required>
        </div>

        <button type="submit" class="btn-signup">Sign Up</button>
    </form>

    <div class="footer-prompt">
        Already have an account? <a href="log_in.html">Log in</a>
    </div>
</div>

<script src="../js/maintenance-settings.js"></script>
<script src="../js/app-runtime.js"></script>
</body>
</html>
