<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreezby Bakeshop - Log In</title>
    <link rel="stylesheet" href="../css/pages/log_in.css">

    
</head>
<body>

<div class="login-container">
    <div class="logo-placeholder">Kreezby</div>
    <div class="tagline">The Crinkle Factory - Making your life sweeter!</div>
    
    <h2>Log In</h2>
    
    <form class="login-form" novalidate onsubmit="return false;">
        <div class="input-group">
            <input type="text" name="identity" placeholder="Email or Name" required>
        </div>
        <div class="input-group">
            <input type="password" name="password" placeholder="Password" required>
        </div>
        
        <button type="submit" class="btn-login">Log In</button>
    </form>
    
    <div class="links-container">
        <p><a href="sign_up.html">Forgot password?</a></p>
        <p class="signup-prompt">Don't have an account? <a href="sign_up.html">Sign Up</a></p>
        <p class="signup-prompt" style="margin-top:12px;font-size:12px;color:#888;">Quick login: <strong>brent_admin</strong>, <strong>staff1</strong>, <strong>retailer</strong>, <strong>customer</strong> / <strong>kreezby123</strong></p>
    </div>
</div>

<script src="../js/maintenance-settings.js"></script>
<script src="../js/app-runtime.js"></script>
</body>
</html>
